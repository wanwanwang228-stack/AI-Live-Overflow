<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=300,height=350"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:300px;height:350px;font-family:sans-serif;display:flex;justify-content:center;align-items:flex-start;padding-top:10px}
#wrap{position:relative;width:160px;height:200px}
#pet{width:160px;height:160px;transition:transform .3s}
#bubble{position:absolute;top:0;left:50%;transform:translateX(-50%);background:#fff;color:#333;padding:5px 12px;border-radius:16px;font-size:12px;white-space:nowrap;opacity:0;transition:opacity .3s;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:10}
#bubble.show{opacity:1}
#bubble::after{content:'';position:absolute;bottom:-6px;left:50%;margin-left:-6px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid #fff}
#headphones{position:absolute;top:40px;left:33px;width:94px;height:30px;opacity:0;transition:opacity .3s}
#headphones.show{opacity:1}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.eye{animation:blink 3s infinite;transform-origin:center}
.bounce{animation:bounce .4s}
.shake{animation:shake .3s}
</style></head><body>
<div id="wrap">
  <div id="bubble"></div>
  <svg id="pet" viewBox="0 0 160 160">
    <ellipse cx="80" cy="80" rx="70" ry="62" fill="#f5f5f5" stroke="#bbb" stroke-width="2"/>
    <ellipse cx="30" cy="35" rx="22" ry="26" fill="#f5f5f5" stroke="#bbb" stroke-width="2" transform="rotate(-15,30,35)"/>
    <ellipse cx="130" cy="35" rx="22" ry="26" fill="#f5f5f5" stroke="#bbb" stroke-width="2" transform="rotate(15,130,35)"/>
    <ellipse cx="30" cy="35" rx="11" ry="15" fill="#ffd0d8" transform="rotate(-15,30,35)"/>
    <ellipse cx="130" cy="35" rx="11" ry="15" fill="#ffd0d8" transform="rotate(15,130,35)"/>
    <ellipse id="face" cx="80" cy="78" rx="54" ry="44" fill="#ffffff" stroke="#bbb" stroke-width="1.5"/>
    <ellipse id="left-eye" class="eye" cx="62" cy="70" rx="10" ry="12" fill="#333"/>
    <ellipse id="right-eye" class="eye" cx="98" cy="70" rx="10" ry="12" fill="#333"/>
    <circle cx="66" cy="65" r="3.5" fill="#fff"/>
    <circle cx="102" cy="65" r="3.5" fill="#fff"/>
    <path id="mouth" d="M68 92 Q80 102 92 92" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round"/>
    <ellipse id="blush-l" cx="44" cy="84" rx="11" ry="7" fill="#ffb3b3" opacity=".35"/>
    <ellipse id="blush-r" cx="116" cy="84" rx="11" ry="7" fill="#ffb3b3" opacity=".35"/>
    <ellipse cx="48" cy="142" rx="18" ry="11" fill="#e8e8e8" stroke="#bbb" stroke-width="1.5"/>
    <ellipse cx="112" cy="142" rx="18" ry="11" fill="#e8e8e8" stroke="#bbb" stroke-width="1.5"/>
    <path d="M148 80 Q168 60 158 95 Q150 115 138 100" fill="none" stroke="#bbb" stroke-width="2"/>
  </svg>
  <svg id="headphones" viewBox="0 0 94 30">
    <path d="M10 25 Q10 5 47 5 Q84 5 84 25" fill="none" stroke="#555" stroke-width="3"/>
    <rect x="2" y="15" width="12" height="15" rx="4" fill="#555"/>
    <rect x="80" y="15" width="12" height="15" rx="4" fill="#555"/>
  </svg>
</div>
<script>
var pet=document.getElementById('pet');
var bubble=document.getElementById('bubble');
var headphones=document.getElementById('headphones');
var blushL=document.getElementById('blush-l');
var blushR=document.getElementById('blush-r');
var mouth=document.getElementById('mouth');

function showBubble(text){bubble.textContent=text;bubble.classList.add('show');setTimeout(function(){bubble.classList.remove('show')},2000)}
function setBlush(v){blushL.setAttribute('opacity',v?'.6':'.35');blushR.setAttribute('opacity',v?'.6':'.35')}

function trigger(type){
  switch(type){
    case 'tap':pet.classList.add('bounce');setTimeout(function(){pet.classList.remove('bounce')},400);showBubble(['\u561f!','\u55f5?','\u545c~','\u563b!'][Math.floor(Math.random()*4)]);break;
    case 'double_tap':showBubble('\u2764\ufe0f');setBlush(true);setTimeout(function(){setBlush(false)},1500);break;
    case 'long_press':showBubble('\u2260\u2033\u2260');pet.classList.add('shake');setTimeout(function(){pet.classList.remove('shake')},300);break;
    case 'combo3':showBubble('\u556a\u556a\u556a!');break;
    case 'combo5':showBubble('\u8981\u7834\u4e86\u5566!!');break;
  }
}

function applyState(key,value){
  switch(key){
    case 'mood':if(value==='happy')showBubble('\u2728');else if(value==='sad'){mouth.setAttribute('d','M68 98 Q80 92 92 98');showBubble('\uD83D\uDE22')}break;
    case 'speech':showBubble(value);break;
    case 'music':headphones.classList.toggle('show',value==='on');break;
    case 'heat':setBlush(parseInt(value)>50);break;
    case 'sleep':pet.style.opacity=value==='on'?'.5':'1';break;
  }
}

setInterval(function(){var eyes=document.querySelectorAll('.eye');eyes.forEach(function(e){e.style.animation='none';setTimeout(function(){e.style.animation='blink 3s infinite'},100)})},8000);
setInterval(function(){if(!bubble.classList.contains('show')){var msgs=['zzZ...','\u2022\u1d17\u2022','\u55f5?','\u2306 \u203f \u2306','\u2728'];showBubble(msgs[Math.floor(Math.random()*msgs.length)])}},30000);
</script>
</body></html>
