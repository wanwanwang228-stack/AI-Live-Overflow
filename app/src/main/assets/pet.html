<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;overflow:hidden;width:200px;height:200px;font-family:sans-serif}
#pet{position:relative;width:120px;height:120px;margin:20px auto;transition:transform .3s}
#pet.blush #face{fill:#ffaaaa}
#pet.angry #left-eye,#pet.angry #right-eye{transform:rotate(15deg)}
#bubble{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:#fff;color:#333;padding:4px 10px;border-radius:14px;font-size:11px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#bubble.show{opacity:1}
#bubble::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid #fff}
#headphones{position:absolute;top:-8px;left:13px;width:94px;height:30px;opacity:0;transition:opacity .3s}
#headphones.show{opacity:1}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.eye{animation:blink 3s infinite;transform-origin:center}
.bounce{animation:bounce .4s}
.shake{animation:shake .3s}
</style></head><body>
<div id="pet">
  <svg viewBox="0 0 120 120" width="120" height="120">
    <!-- body -->
    <ellipse cx="60" cy="65" rx="50" ry="45" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
    <!-- ears -->
    <ellipse cx="20" cy="28" rx="16" ry="20" fill="#f0f0f0" stroke="#ccc" stroke-width="2" transform="rotate(-15,20,28)"/>
    <ellipse cx="100" cy="28" rx="16" ry="20" fill="#f0f0f0" stroke="#ccc" stroke-width="2" transform="rotate(15,100,28)"/>
    <!-- inner ears -->
    <ellipse cx="20" cy="28" rx="8" ry="12" fill="#ffccd5" transform="rotate(-15,20,28)"/>
    <ellipse cx="100" cy="28" rx="8" ry="12" fill="#ffccd5" transform="rotate(15,100,28)"/>
    <!-- face -->
    <ellipse id="face" cx="60" cy="62" rx="38" ry="32" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
    <!-- eyes -->
    <ellipse id="left-eye" class="eye" cx="46" cy="56" rx="7" ry="9" fill="#333"/>
    <ellipse id="right-eye" class="eye" cx="74" cy="56" rx="7" ry="9" fill="#333"/>
    <!-- eye shine -->
    <circle cx="48" cy="53" r="2.5" fill="#fff"/>
    <circle cx="76" cy="53" r="2.5" fill="#fff"/>
    <!-- mouth -->
    <path id="mouth" d="M52 72 Q60 80 68 72" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round"/>
    <!-- blush -->
    <ellipse id="blush-l" cx="34" cy="66" rx="8" ry="5" fill="#ffb3b3" opacity=".3"/>
    <ellipse id="blush-r" cx="86" cy="66" rx="8" ry="5" fill="#ffb3b3" opacity=".3"/>
    <!-- feet -->
    <ellipse cx="35" cy="108" rx="14" ry="8" fill="#e8e8e8" stroke="#ccc" stroke-width="1.5"/>
    <ellipse cx="85" cy="108" rx="14" ry="8" fill="#e8e8e8" stroke="#ccc" stroke-width="1.5"/>
    <!-- tail -->
    <path d="M110 60 Q125 45 118 70 Q112 85 105 75" fill="none" stroke="#ccc" stroke-width="2"/>
  </svg>
  <svg id="headphones" viewBox="0 0 94 30">
    <path d="M10 25 Q10 5 47 5 Q84 5 84 25" fill="none" stroke="#555" stroke-width="3"/>
    <rect x="2" y="15" width="12" height="15" rx="4" fill="#555"/>
    <rect x="80" y="15" width="12" height="15" rx="4" fill="#555"/>
  </svg>
</div>
<div id="bubble"></div>
<script>
const pet=document.getElementById('pet');
const bubble=document.getElementById('bubble');
const headphones=document.getElementById('headphones');
const blushL=document.getElementById('blush-l');
const blushR=document.getElementById('blush-r');
const mouth=document.getElementById('mouth');

let SUPABASE_URL='',SUPABASE_KEY='';

function showBubble(text){bubble.textContent=text;bubble.classList.add('show');setTimeout(()=>bubble.classList.remove('show'),2000)}
function setBlush(v){blushL.setAttribute('opacity',v?'.6':'.3');blushR.setAttribute('opacity',v?'.6':'.3')}

function trigger(type){
  switch(type){
    case 'tap':pet.classList.add('bounce');setTimeout(()=>pet.classList.remove('bounce'),400);showBubble(['\u561f!','\u55f5?','\u545c~','\u563b!'][Math.floor(Math.random()*4)]);break;
    case 'double_tap':showBubble('\u2764\ufe0f');setBlush(true);setTimeout(()=>setBlush(false),1500);break;
    case 'long_press':showBubble('\u2260\u2033\u2260');pet.classList.add('shake');setTimeout(()=>pet.classList.remove('shake'),300);break;
    case 'combo3':showBubble('\u556a\u556a\u556a!');break;
    case 'combo5':showBubble('\u8981\u7834\u4e86\u5566!!');break;
  }
}

function applyState(key,value){
  switch(key){
    case 'mood':if(value==='happy')showBubble('\u2728');else if(value==='sad'){mouth.setAttribute('d','M52 78 Q60 72 68 78');showBubble('\ud83d\ude22')};break;
    case 'speech':showBubble(value);break;
    case 'music':headphones.classList.toggle('show',value==='on');break;
    case 'heat':setBlush(parseInt(value)>50);break;
    case 'sleep':pet.style.opacity=value==='on'?'.5':'1';break;
  }
}

// idle auto-blink variance
setInterval(()=>{const eyes=document.querySelectorAll('.eye');eyes.forEach(e=>{e.style.animation='none';setTimeout(()=>e.style.animation='blink 3s infinite',100)})},8000);

// auto idle murmurs
setInterval(()=>{if(!bubble.classList.contains('show')){const msgs=['zzZ...','\u2022\u1d17\u2022','\u55f5?','\u2306 \u203f \u2306','\u2728'];showBubble(msgs[Math.floor(Math.random()*msgs.length)])}},30000);
</script>
</body></html>
