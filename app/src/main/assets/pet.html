<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;width:300px;height:350px;font-family:sans-serif}
#pet{position:relative;width:140px;height:140px;margin:40px auto 0;transition:transform .3s}
#pet.blush #face{fill:#ffaaaa}
#pet.angry #left-eye,#pet.angry #right-eye{transform:rotate(15deg)}
#bubble{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#fff;color:#333;padding:4px 10px;border-radius:14px;font-size:11px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:10}
#bubble.show{opacity:1}
#bubble::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid #fff}
#headphones{position:absolute;top:32px;left:23px;width:94px;height:30px;opacity:0;transition:opacity .3s}
#headphones.show{opacity:1}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.eye{animation:blink 3s infinite;transform-origin:center}
.bounce{animation:bounce .4s}
.shake{animation:shake .3s}
</style></head><body>
<div id="pet">
  <svg viewBox="0 0 140 140" width="140" height="140">
    <ellipse cx="70" cy="72" rx="55" ry="50" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
    <ellipse cx="24" cy="32" rx="18" ry="22" fill="#f0f0f0" stroke="#ccc" stroke-width="2" transform="rotate(-15,24,32)"/>
    <ellipse cx="116" cy="32" rx="18" ry="22" fill="#f0f0f0" stroke="#ccc" stroke-width="2" transform="rotate(15,116,32)"/>
    <ellipse cx="24" cy="32" rx="9" ry="13" fill="#ffccd5" transform="rotate(-15,24,32)"/>
    <ellipse cx="116" cy="32" rx="9" ry="13" fill="#ffccd5" transform="rotate(15,116,32)"/>
    <ellipse id="face" cx="70" cy="68" rx="42" ry="36" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/>
    <ellipse id="left-eye" class="eye" cx="54" cy="62" rx="8" ry="10" fill="#333"/>
    <ellipse id="right-eye" class="eye" cx="86" cy="62" rx="8" ry="10" fill="#333"/>
    <circle cx="56" cy="58" r="3" fill="#fff"/>
    <circle cx="88" cy="58" r="3" fill="#fff"/>
    <path id="mouth" d="M60 80 Q70 88 80 80" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round"/>
    <ellipse id="blush-l" cx="38" cy="74" rx="9" ry="6" fill="#ffb3b3" opacity=".3"/>
    <ellipse id="blush-r" cx="102" cy="74" rx="9" ry="6" fill="#ffb3b3" opacity=".3"/>
    <ellipse cx="40" cy="120" rx="16" ry="9" fill="#e8e8e8" stroke="#ccc" stroke-width="1.5"/>
    <ellipse cx="100" cy="120" rx="16" ry="9" fill="#e8e8e8" stroke="#ccc" stroke-width="1.5"/>
    <path d="M125 65 Q142 48 135 78 Q128 95 118 85" fill="none" stroke="#ccc" stroke-width="2"/>
  </svg>
  <svg id="headphones" viewBox="0 0 94 30">
    <path d="M10 25 Q10 5 47 5 Q84 5 84 25" fill="none" stroke="#555" stroke-width="3"/>
    <rect x="2" y="15" width="12" height="15" rx="4" fill="#555"/>
    <rect x="80" y="15" width="12" height="15" rx="4" fill="#555"/>
  </svg>
</div>
<div id="bubble"></div>
<script>
const pet=document.getElementById('pet');
const bubble=document.getElementById('bubble');
const headphones=document.getElementById('headphones');
const blushL=document.getElementById('blush-l');
const blushR=document.getElementById('blush-r');
const mouth=document.getElementById('mouth');

function showBubble(text){bubble.textContent=text;bubble.classList.add('show');setTimeout(function(){bubble.classList.remove('show')},2000)}
function setBlush(v){blushL.setAttribute('opacity',v?'.6':'.3');blushR.setAttribute('opacity',v?'.6':'.3')}

function trigger(type){
  switch(type){
    case 'tap':pet.classList.add('bounce');setTimeout(function(){pet.classList.remove('bounce')},400);showBubble(['\u561f!','\u55f5?','\u545c~','\u563b!'][Math.floor(Math.random()*4)]);break;
    case 'double_tap':showBubble('\u2764\ufe0f');setBlush(true);setTimeout(function(){setBlush(false)},1500);break;
    case 'long_press':showBubble('\u2260\u2033\u2260');pet.classList.add('shake');setTimeout(function(){pet.classList.remove('shake')},300);break;
    case 'combo3':showBubble('\u556a\u556a\u556a!');break;
    case 'combo5':showBubble('\u8981\u7834\u4e86\u5566!!');break;
  }
}

function applyState(key,value){
  switch(key){
    case 'mood':if(value==='happy')showBubble('\u2728');else if(value==='sad'){mouth.setAttribute('d','M60 86 Q70 80 80 86');showBubble('\uD83D\uDE22')}break;
    case 'speech':showBubble(value);break;
    case 'music':headphones.classList.toggle('show',value==='on');break;
    case 'heat':setBlush(parseInt(value)>50);break;
    case 'sleep':pet.style.opacity=value==='on'?'.5':'1';break;
  }
}

setInterval(function(){var eyes=document.querySelectorAll('.eye');eyes.forEach(function(e){e.style.animation='none';setTimeout(function(){e.style.animation='blink 3s infinite'},100)})},8000);
setInterval(function(){if(!bubble.classList.contains('show')){var msgs=['zzZ...','\u2022\u1d17\u2022','\u55f5?','\u2306 \u203f \u2306','\u2728'];showBubble(msgs[Math.floor(Math.random()*msgs.length)])}},30000);
</script>
</body></html>
